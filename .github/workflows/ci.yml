name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q

  sql:
    # Build the database from the schema files and have PostgreSQL plan every named query.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5500"
      DB_NAME: sportsuite
      DB_USER: postgres
    steps:
      - name: A throwaway database password for this run
        run: echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - run: docker compose up -d --wait
      - name: Every schema file loaded without an error
        shell: bash
        run: |
          docker compose logs db > db.log
          ! grep -E "ERROR:|psql:.*error" db.log | grep -v "TimescaleDB Background Worker"
      - name: Every named query is planned, none skipped
        shell: bash
        run: |
          python -m pytest tests/unit/test_named_queries_plan.py -q -rs | tee plan.log
          ! grep -q "skipped" plan.log
      - if: always()
        run: docker compose down -v
